function closestOpen(s,point,target,includeTarget=false){
 let best=null,bestDist=Infinity;
 const options=includeTarget?[[0,0],...directions]:directions;
 for(const [dx,dy] of options){const x=target.x+dx,y=target.y+dy;if(tileBlocked(s,x,y))continue;const dist=Math.abs(point.x-x)+Math.abs(point.y-y);if(dist<bestDist){best={x,y};bestDist=dist;}}
 return best;
}
// Bounded A* with Manhattan heuristic. A patient never walks through obstructing furniture or walls.
function findPath(s,start,goal){
 if(!goal)return null;
 const a={x:Math.round(start.x),y:Math.round(start.y)},b={x:goal.x,y:goal.y};
 if(a.x===b.x&&a.y===b.y)return [];
 if(tileBlocked(s,b.x,b.y))return null;
 const open=[a],g=new Map([[key(a.x,a.y),0]]),from=new Map(),done=new Set();
 while(open.length){let index=0,best=Infinity;
  for(let i=0;i<open.length;i++){const p=open[i],score=(g.get(key(p.x,p.y))??Infinity)+Math.abs(p.x-b.x)+Math.abs(p.y-b.y);
   if(score<best){best=score;index=i;}}
  const current=open.splice(index,1)[0],ck=key(current.x,current.y);
  if(current.x===b.x&&current.y===b.y){const result=[];let k=ck;while(k!==key(a.x,a.y)){const [x,y]=k.split(',').map(Number);result.unshift({x,y});k=from.get(k);if(!k)return null;}return result;}
  if(done.has(ck))continue;done.add(ck);
  for(const [dx,dy] of directions){const x=current.x+dx,y=current.y+dy,k=key(x,y);if(tileBlocked(s,x,y)||done.has(k))continue;
   const tentative=(g.get(ck)??Infinity)+1;
   if(tentative<(g.get(k)??Infinity)){from.set(k,ck);g.set(k,tentative);if(!open.some(p=>p.x===x&&p.y===y))open.push({x,y});}}
 }
 return null;
}

function assessClinic(s){
 const max=(key)=>Math.max(0,...s.objects.map(o=>ITEMS[o.type]?.[key]||0));
 const sum=(key)=>s.objects.reduce((n,o)=>n+(ITEMS[o.type]?.[key]||0),0);
 const comfort=clamp(40+sum('amenity')*1.6,40,100);
 return {refraction:max('refraction'),chart:max('chart'),diagnostic:sum('diagnostic'),retail:sum('retail'),comfort,seats:s.objects.reduce((n,o)=>n+(ITEMS[o.type]?.seat||0),0),examStations:s.objects.filter(o=>ITEMS[o.type]?.exam).length,
  quality:clamp(42+max('refraction')*8+max('chart')*5+Math.min(18,sum('diagnostic')*3)+s.staff.assistants*4,30,100)};
}
function getFees(s,p){const clinic=assessClinic(s);const happiness=clamp(100-p.waitTime*.7+(clinic.comfort-50)*.3,20,100);
 const base=45+clinic.refraction*11+clinic.chart*7+Math.min(55,clinic.diagnostic*6);
 const retail=clinic.retail?Math.round((7+clinic.retail*7)*(p.type==='child'?.7:1)):0;
 const tip=happiness>=85?15:0;
 return {coins:Math.max(20,Math.round((base+retail+tip)*(0.68+happiness/280))),xp:Math.round(18+clinic.quality/7+clinic.refraction*4+clinic.diagnostic*2),happiness};
}
function pathTo(s,p,target,{onTile=false}={}){

function spawnPatient(s){
 const live=s.patients.filter(p=>p.stage!=='leaving').length;
 if(live>=16){notice(s,'The clinic is full — patients are leaving!','warning');s.reputation=clamp(s.reputation-1,0,100);s.stats.patientsLost++;return false;}
 const types=['adult','adult','adult','child','elder'],type=types[Math.floor(rng(s)*types.length)];
 const p={id:s.nextPatientId++,type,stage:'to_reception',pos:{x:1,y:9},path:[],target:null,timer:0,waitTime:0,patience:55+rng(s)*40,seatId:null,examId:null,mood:85,step:Math.floor(rng(s)*4),result:null};
 const rec=objectsOf(s,'reception')[0];

function setSeat(s,p){
 const seats=s.objects.filter(o=>isSeat(o)&&!occupiedBy(s,o)).sort((a,b)=>(Math.abs(a.x-p.pos.x)+Math.abs(a.y-p.pos.y))-(Math.abs(b.x-p.pos.x)+Math.abs(b.y-p.pos.y)));
 for(const o of seats){if(pathTo(s,p,o)){p.seatId=o.id;p.stage='to_waiting';p.timer=0;return true;}}
 const point=closestOpen(s,p.pos,{x:3,y:5},true);
 if(point&&pathTo(s,p,point,{onTile:true})){p.stage='to_waiting';p.timer=0;return true;}

function tryAssignExam(s){
 const busy=new Set(s.patients.filter(p=>p.examId&&['to_exam','exam'].includes(p.stage)).map(p=>p.examId));
 const chairs=s.objects.filter(o=>ITEMS[o.type]?.exam&&!busy.has(o.id));
 const capacity=Math.max(0,s.staff.doctors-s.patients.filter(p=>['to_exam','exam'].includes(p.stage)).length);
 if(!capacity)return;
 let assigned=0;
 for(const p of s.patients.filter(p=>p.stage==='waiting').sort((a,b)=>b.waitTime-a.waitTime)){
  if(assigned>=capacity)break;
  for(const o of chairs){if(pathTo(s,p,o)){p.stage='to_exam';p.examId=o.id;p.timer=0;p.seatId=null;busy.add(o.id);chairs.splice(chairs.indexOf(o),1);assigned++;break;}}
 }
}
function patientReached(s,p){
 p.path=[];p.timer=0;
 switch(p.stage){
 case 'to_reception':p.stage='checkin';p.timer=Math.max(1.5,4.5-s.staff.receptionists*.9-s.staff.assistants*.4);break;
 case 'to_waiting':p.stage='waiting';p.timer=0;break;
 case 'to_exam':p.stage='exam';p.timer=Math.max(4,12-assessClinic(s).refraction*.9-s.staff.assistants*1.2-(s.staff.doctors>1?1:0));break;

 }
}
function movePatient(s,p,dt){
 if(!p.path.length){patientReached(s,p);return;}
 let remaining=dt*(p.type==='elder'?1.0:p.type==='child'?1.8:1.5);
 while(remaining>0&&p.path.length){const goal=p.path[0],dx=goal.x-p.pos.x,dy=goal.y-p.pos.y,len=Math.hypot(dx,dy);
  if(len<=remaining+.0001){p.pos={x:goal.x,y:goal.y};remaining-=len;p.path.shift();if(!p.path.length){patientReached(s,p);break;}}
  else {p.pos.x+=remaining*dx/len;p.pos.y+=remaining*dy/len;remaining=0;}
 }
}
function award(s,p){
 const result=getFees(s,p);p.result=result;s.cash+=result.coins;s.xp+=result.xp;s.level=levelForXp(s.xp);s.stats.totalPatients++;s.stats.todayPatients++;s.stats.todayIncome+=result.coins;s.stats.totalIncome+=result.coins;
 s.reputation=clamp(s.reputation+(result.happiness>75?.5:-.75),0,100);
 notice(s,`+${result.coins} coins · +${result.xp} XP · ${Math.round(result.happiness)}% happy`,'success');
 for(const m of MILESTONES){if(!s.completedMilestones.includes(m.id)&&s.stats[m.stat]>=m.target||(!s.completedMilestones.includes(m.id)&&m.stat==='reputation'&&s.reputation>=m.target)){
  s.completedMilestones.push(m.id);s.cash+=m.reward;notice(s,`Achievement: ${m.name}! +${m.reward} coins`,'achievement');}}

 if(!pathTo(s,p,{x:1,y:9},{onTile:true}))p.stage='gone';

function advance(s,dt){
 if(s.paused||dt<=0)return;
 dt=Math.min(dt,.25)*s.speed;
 s.minutes+=dt*4;
 if(s.minutes>=17*60){
  s.minutes=9*60+(s.minutes-17*60);s.day++;
  const wages=s.staff.receptionists*95+s.staff.doctors*175+s.staff.assistants*65;
  const bills=45+Math.max(0,s.objects.length-20)*3;
  s.cash-=wages+bills;
  s.stats.yesterdayPatients=s.stats.todayPatients;s.stats.yesterdayIncome=s.stats.todayIncome;
  s.dailyHistory.push({day:s.day-1,patients:s.stats.todayPatients,income:s.stats.todayIncome,expenses:wages+bills});
  if(s.dailyHistory.length>30)s.dailyHistory.shift();
  notice(s,`Day ${s.day-1} complete · wages & rent −${wages+bills}`,'warning');
  s.stats.todayPatients=0;s.stats.todayIncome=0;
 }
 s.arrivalTimer-=dt;
 if(s.arrivalTimer<=0){spawnPatient(s);const clinic=assessClinic(s);
  s.arrivalTimer=clamp(14-((s.reputation-50)/12)-Math.min(s.level*.22,4)+rng(s)*5,4,20);
 }
 for(const p of s.patients){
  if(p.stage==='to_reception'||p.stage==='to_waiting'||p.stage==='to_exam'||p.stage==='leaving')movePatient(s,p,dt);
  else if(p.stage==='checkin') {p.timer-=dt;if(p.timer<=0){if(!setSeat(s,p)){p.stage='waiting';p.timer=0;}}}

  }

function reachable(s){

  const around=directions.map(([dx,dy])=>({x:o.x+dx,y:o.y+dy})).filter(p=>!tileBlocked(s,p.x,p.y));

}
function editTile(s,mode,x,y,value){
 if(x<0||y<0||x>=W||y>=H)return {ok:false,message:'Outside your practice'};
 if(mode==='floor'){
  if(!Number.isInteger(value)||value<0||value>7)return {ok:false,message:'Unknown floor'};
  if(s.floors[y*W+x]===value)return {ok:false,message:'Already painted'};
  const price=([2,2,3,3,3,4,5,5][value]);if(s.cash<price)return {ok:false,message:'Not enough coins'};
  s.floors[y*W+x]=value;s.cash-=price;s.stats.spent+=price;return {ok:true,message:`Floor installed · −${price}`};
 }
 if(mode==='erase'){
  const candidates=s.objects.filter(o=>o.x===x&&o.y===y);
  if(!candidates.length)return {ok:false,message:'Nothing to remove'};
  const o=candidates.at(-1);
  if(['reception','exam_chair'].includes(o.type)&&s.objects.filter(q=>q.type===o.type).length<=1)return {ok:false,message:'You need at least one reception and exam chair'};
  const ix=s.objects.indexOf(o);s.objects.splice(ix,1);
  if(!reachable(s)){s.objects.splice(ix,0,o);return {ok:false,message:'Cannot block patient access'};}
  const refund=Math.round((ITEMS[o.type]?.cost||0)*.4);s.cash+=refund;
  for(const p of s.patients){if(p.seatId===o.id)p.seatId=null;if(p.examId===o.id)p.examId=null;}
  return {ok:true,message:`Sold ${ITEMS[o.type]?.name} · +${refund}`};
 }
 if(mode!=='place'||!ITEMS[value])return {ok:false,message:'Choose an item'};
 const item=ITEMS[value];if((item.level||1)>s.level)return {ok:false,message:`Unlocks at level ${item.level}`};
 if(x===1&&y===9)return {ok:false,message:'Keep the front entrance clear'};
 if(s.objects.some(o=>o.x===x&&o.y===y&&(ITEMS[o.type]?.solid||item.solid)))return {ok:false,message:'That tile is occupied'};
 if(s.cash<item.cost)return {ok:false,message:'Not enough coins'};
 const o={id:s.nextObjectId++,type:value,x,y,rotation:0};s.objects.push(o);
 if(!reachable(s)){s.objects.pop();return {ok:false,message:'You would block patient access'};}
 s.cash-=item.cost;s.stats.spent+=item.cost;
 if(item.category==='Decor')s.stats.decorPlaced++;
 notice(s,`${item.name} purchased · −${item.cost}`,'info');
 return {ok:true,message:`Placed ${item.name}`};
}
function upgrade(s,chainId){

 const owned=s.objects.filter(o=>chain.types.includes(o.type)).sort((a,b)=>chain.types.indexOf(b.type)-chain.types.indexOf(a.type));
 if(!owned.length)return {ok:false,message:'Place the starter equipment first'};
 const o=owned[0],at=chain.types.indexOf(o.type),next=chain.types[at+1];
 if(!next)return {ok:false,message:'Already at maximum upgrade'};
 const item=ITEMS[next];if(s.level<(item.level||1))return {ok:false,message:`Requires clinic level ${item.level}`};
 if(s.cash<item.cost)return {ok:false,message:'Not enough coins'};
 s.cash-=item.cost;s.stats.spent+=item.cost;o.type=next;

}
function hire(s,role){
 const configs={receptionists:{price:300,wages:95,max:2,label:'Receptionist'},doctors:{price:1100,wages:175,max:3,label:'Optometrist'},assistants:{price:550,wages:65,max:3,label:'Assistant'}};
 const c=configs[role];if(!c)return {ok:false,message:'Unknown role'};
 if(s.staff[role]>=c.max)return {ok:false,message:'Maximum staff reached'};
 if(s.cash<c.price)return {ok:false,message:'Not enough coins'};
 s.staff[role]++;s.cash-=c.price;s.stats.spent+=c.price;notice(s,`${c.label} joined the team!`,'achievement');return {ok:true,message:`Hired ${c.label}`};
}

}

   const p=entry.data,pos=this.iso(p.pos.x+.5,p.pos.y+.5),moving=p.path?.length>0;
   let dir=0;if(moving){const step=p.path[0],dx=step.x-p.pos.x,dy=step.y-p.pos.y;dir=Math.abs(dx)>Math.abs(dy)?(dx>0?2:1):(dy>0?0:3);}
   this.character(p.type,pos.x,pos.y,dir,moving?Math.floor(this.clock*9+p.step)%4:0,1);
   if(p.stage==='exam'&&Math.floor(this.clock*3)%4<3)this.textBubble('👁',pos.x,pos.y-46*this.zoom,'#e9f9ff');
   if(p.stage==='waiting'&&p.waitTime>20)this.textBubble('⌛',pos.x,pos.y-45*this.zoom,p.waitTime>40?'#fff0ec':'#fff9e5');
  }else{const pos=this.iso(entry.x+.5,entry.y+.5);this.character(entry.role,pos.x,pos.y,0,Math.floor(this.clock*2)%4,1);}
 }
 if(this.hover&&this.hover.x>=0&&this.hover.y>=0&&this.hover.x<W&&this.hover.y<H){const p=this.iso(this.hover.x+.5,this.hover.y+.5);
  this.diamond(p.x,p.y,tool.mode==='erase'?'#f06d6569':'#a3eff07d',tool.mode==='erase'?'#e36e60':'#2c8cbe');
  if(tool.mode==='place'&&tool.selected&&tool.selected!=='wall'&&ITEMS[tool.selected])this.sprite(tool.selected,p.x,p.y,.66);
 }
 // Decorative sign outside clinic entrance.
 const entry=this.iso(.7,9.6);
 c.save();c.translate(entry.x-55*this.zoom,entry.y+40*this.zoom);c.rotate(-.07);c.fillStyle='#fff5db';c.strokeStyle='#537b82';c.lineWidth=2;c.beginPath();c.roundRect(-53*this.zoom,-15*this.zoom,107*this.zoom,32*this.zoom,5*this.zoom);c.fill();c.stroke();c.font=`900 ${15*this.zoom}px system-ui`;c.fillStyle='#3a7398';c.textAlign='center';c.fillText('✧ LITTLE EYES ✧',0,6*this.zoom);c.restore();
 }
 drawBuildingWall(x,y,len,axis){const c=this.ctx,z=this.zoom;
  for(let i=0;i<len;i++){
   const cx=axis==='north'?x+i:y===99?0:0,cy=axis==='west'?y+i:0;
   const p=axis==='north'?this.iso(cx,cy):this.iso(0,cy);
   const q=axis==='north'?this.iso(cx+1,cy):this.iso(0,cy+1);
   const h=84*z;
   c.fillStyle=axis==='north'?'#fff3e2':'#eaf5ed';c.strokeStyle='#9bbab3';c.lineWidth=1;
   c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.lineTo(q.x,q.y-h);c.lineTo(p.x,p.y-h);c.closePath();c.fill();c.stroke();
   if(i%4===2){c.fillStyle='#a0d8ee';c.beginPath();const t=(v,w,k)=>(1-k)*v+k*w;
    const p1={x:t(p.x,q.x,.16),y:t(p.y,q.y,.16)},p2={x:t(p.x,q.x,.83),y:t(p.y,q.y,.83)};
    c.moveTo(p1.x,p1.y-18*z);c.lineTo(p2.x,p2.y-18*z);c.lineTo(p2.x,p2.y-h+17*z);c.lineTo(p1.x,p1.y-h+17*z);c.closePath();c.fill();c.stroke();}
  }
 }
}

function modal(title,html){el('modalTitle').textContent=title;el('modalContent').innerHTML=html;el('modalBackdrop').classList.remove('hidden');setShop(false)}

  modal('👩🏽‍⚕️ Your Team',html);
 }else if(which==='finance'){
  const stats=state.stats,wages=state.staff.receptionists*95+state.staff.doctors*175+state.staff.assistants*65,profit=stats.todayIncome-wages-45;
  let html=`<div class="value-grid"><div class="value-card"><strong>🟡 ${fmt(stats.todayIncome)}</strong><span>Today's earnings</span></div><div class="value-card"><strong>${stats.todayPatients}</strong><span>Patients today</span></div><div class="value-card"><strong>${stats.totalPatients}</strong><span>Lifetime exams</span></div><div class="value-card"><strong>${Math.round(state.reputation)}%</strong><span>Reputation</span></div></div><h3 class="section-sub">Daily operating costs</h3><div class="info-card"><span class="emoji">🧾</span><div class="body"><strong>🟡 ${fmt(wages+45)}/day</strong><small>Team payroll ${wages} · basic rent 45 (+ extra furnishing costs)</small></div></div><h3 class="section-sub">Clinic performance</h3><div class="info-card"><div class="body"><strong>👁 Quality score ${Math.round(clinic.quality)} / 100</strong><div class="mini-progress"><span style="width:${clinic.quality}%"></span></div><small>Comfort ${Math.round(clinic.comfort)} · Refraction tier ${clinic.refraction} · ${clinic.examStations} exam chair(s)</small></div></div><div class="info-card"><div class="body"><strong>🪙 ${fmt(stats.totalIncome)} lifetime income</strong><small>${stats.patientsLost} patients left before treatment · ${fmt(stats.spent)} spent on upgrades</small></div></div>`;

let pointers=new Map(),startPoint=null,wasDrag=false,dist0=0;
const xy=e=>{const r=view.canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
function handleDown(e){e.preventDefault();view.canvas.setPointerCapture(e.pointerId);const p=xy(e);pointers.set(e.pointerId,p);if(pointers.size===1){startPoint={...p};wasDrag=false;}if(pointers.size===2){const a=[...pointers.values()];dist0=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);wasDrag=true;}}
function handleMove(e){const p=xy(e);const prev=pointers.get(e.pointerId);if(pointers.has(e.pointerId)){pointers.set(e.pointerId,p);
 if(pointers.size===2){const a=[...pointers.values()];const distance=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);if(dist0>1)view.zoomAt(distance/dist0);dist0=distance;}
 else if(prev&&startPoint){if(Math.hypot(p.x-startPoint.x,p.y-startPoint.y)>9)wasDrag=true;if(wasDrag){view.panX+=p.x-prev.x;view.panY+=p.y-prev.y;}}
 }
 view.hover=view.inverse(p.x,p.y);
}
function handleUp(e){const p=xy(e);const click=!wasDrag&&pointers.size===1;if(click){const at=view.inverse(p.x,p.y);worldTap(at.x,at.y)}pointers.delete(e.pointerId);if(!pointers.size)startPoint=null;}
view.canvas.addEventListener('pointerdown',handleDown);view.canvas.addEventListener('pointermove',handleMove);view.canvas.addEventListener('pointerup',handleUp);view.canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId)});
view.canvas.addEventListener('pointerleave',()=>view.hover=null);
view.canvas.addEventListener('wheel',e=>{e.preventDefault();view.zoomAt(e.deltaY>0?.91:1.10)},{passive:false});
el('zoomIn').onclick=()=>view.zoomAt(1.22);el('zoomOut').onclick=()=>view.zoomAt(.82);el('homeCamera').onclick=()=>{view.panX=0;view.panY=0;view.zoom=window.innerWidth<730?.75:1;};

el('modalContent').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,arg=b.dataset.arg;
 let result=null;

 else if(action==='hire')result=hire(state,arg);
 else if(action==='fire')result=fire(state,arg);
 else if(action==='save'){save();result={ok:true,message:'Clinic saved!'}}
 else if(action==='export'){const blob=new Blob([serialize(state)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='little-eyes-clinic-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2500);result={ok:true,message:'Save file exported'}}
 else if(action==='import'){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const newState=loadGame(await input.files[0].text());if(!newState)throw Error('Invalid save file');state=newState;save();eventIndex=state.notificationId;openPanel('settings');notify('Save imported!','success')}catch(e){notify('Invalid or incompatible save file','warning')}};input.click();}
 else if(action==='help'){modal('❔ How to play',`<div class="modal-help"><p><strong>1. Serve your patients.</strong> They walk from the entrance to reception, wait for a chair, enter the exam room, and leave after completing their test. Every finished examination earns coins, XP and reputation.</p><p><strong>2. Build and decorate.</strong> Open Build, choose a category and tap a floor tile. Paint new floors, place walls, furniture, signs and clinical equipment. Tap Sell to remove an object for a partial refund. Keep routes clear!</p><p><strong>3. Upgrade your practice.</strong> Use Research to replace a trial frame with a manual or digital phoropter. Chart displays and optional diagnostics also improve income and exam quality.</p><p><strong>4. Hire staff.</strong> Team members speed up service, but collect wages each evening. Add examination chairs to accommodate more optometrists.</p><p><strong>5. Manage your business.</strong> Comfortable patients leave happy. Long waits cost reputation. Unlock new furnishings, earn achievements and customize every room.</p><p><strong>Camera:</strong> Drag to pan · pinch or use +/− to zoom. Saves automatically in your browser.</p></div>`);return;}
 else if(action==='reset'){if(window.confirm('Start a brand new Little Eyes clinic? This overwrites your current saved game.')){state=initialGame();eventIndex=0;tool={mode:'inspect',selected:null};save();openPanel('settings');notify('Welcome to your new clinic!','success')}return;}
 else if(action==='sound'){notify('Audio implementation is planned for a later version');return;}
 if(result){notify(result.message,result.ok?'success':'warning');if(result.ok)save();renderHud();openPanel(panel)}
});
const ro=new ResizeObserver(()=>view.resize());ro.observe(el('game'));
function loop(now){let dt=Math.min(.25,(now-framePrev)/1000||0);framePrev=now;simAccum+=dt;saveAcc+=dt;uiAcc+=dt;
 while(simAccum>=1/30){advance(state,1/30);simAccum-=1/30;}

}
